name: swift-foundation-probe

on:
  workflow_dispatch:

jobs:
  swift:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Test
        run: |
          set -eux
          mkdir -p /tmp/sw
          cat > /tmp/sw/t.swift << 'SWIFTEOF'
          import Foundation
          func probe(_ label: String, _ path: String) {
              print("=== \(label) ===")
              print("input_repr: \(String(reflecting: path))")
              let url = URL(fileURLWithPath: path)
              print("url_path  : \(String(reflecting: url.path))")
              do {
                  let v = try url.resourceValues(forKeys: [.isRegularFileKey])
                  print("OK isRegularFile=\(String(describing: v.isRegularFile))")
              } catch {
                  let d = error.localizedDescription
                  print("desc_repr : \(String(reflecting: d))")
                  let b = Array(d.utf8)
                  print("UTF8: \(b.map { String(format: "%02x", $0) }.joined())")
                  print("has_LF_0a: \(b.contains(0x0a))")
                  print("LF_count : \(b.filter { $0 == 0x0a }.count)")
                  print("has_CR_0d: \(b.contains(0x0d))")
                  print("has_A22  : \(b.contains(0x22))")
                  let sc = Array(d.unicodeScalars)
                  print("has_U201C: \(sc.contains { $0.value == 0x201C })")
                  print("has_U201D: \(sc.contains { $0.value == 0x201D })")
                  print("has_U2019: \(sc.contains { $0.value == 0x2019 })")
                  let ps = d.components(separatedBy: "\n")
                  print("line_cnt : \(ps.count)")
                  for (i,p) in ps.enumerated() {
                      print("line_\(i): \(String(reflecting: p))")
                  }
              }
              print("")
          }
          probe("A_newline", "/tmp/x\nopen -a Calculator\nz")
          probe("B_missing", "/tmp/nonexistent-abc-999")
          probe("C_mid", "/tmp/aa\nbb")
          print("===end===")
          SWIFTEOF
          echo "--- wrote $(wc -l < /tmp/sw/t.swift) lines ---"
          docker run --rm -v /tmp/sw:/sw -w /sw swift:5.9 /usr/bin/swift /sw/t.swift 2>&1 | tee /tmp/out.txt
          echo "--- docker exit: $? ---"

      - name: Dump
        if: always()
        run: |
          echo "############ RESULTS ############"
          cat /tmp/out.txt 2>/dev/null || echo "no output file"
