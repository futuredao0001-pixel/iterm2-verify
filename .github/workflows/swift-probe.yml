name: swift-foundation-probe

on:
  workflow_dispatch:

jobs:
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Swift version
        run: swift --version

      - name: Write test
        run: |
          mkdir -p work
          cat > work/t.swift << 'SWIFTEOF'
          import Foundation

          func probe(_ label: String, _ path: String) {
              print("=== \(label) ===")
              print("input repr : \(String(reflecting: path))")
              let url = URL(fileURLWithPath: path)
              print("url.path   : \(String(reflecting: url.path))")
              do {
                  let v = try url.resourceValues(forKeys: [.isRegularFileKey])
                  print("OK: isRegularFile=\(String(describing: v.isRegularFile))")
              } catch {
                  let d = error.localizedDescription
                  print("localizedDescription.repr : \(String(reflecting: d))")
                  let bytes = Array(d.utf8)
                  print("utf8 hex : \(bytes.map { String(format: "%02x", $0) }.joined(separator: " "))")
                  print("has_LF_0a        : \(bytes.contains(0x0a))")
                  print("LF_count         : \(bytes.filter { $0 == 0x0a }.count)")
                  print("has_CR_0d        : \(bytes.contains(0x0d))")
                  print("has_ASCII_22     : \(bytes.contains(0x22))")
                  let scalars = Array(d.unicodeScalars)
                  print("has_U201C        : \(scalars.contains { $0.value == 0x201C })")
                  print("has_U201D        : \(scalars.contains { $0.value == 0x201D })")
                  print("has_U2019        : \(scalars.contains { $0.value == 0x2019 })")
                  let parts = d.components(separatedBy: "\n")
                  print("line_count       : \(parts.count)")
                  for (i, p) in parts.enumerated() {
                      print("  line[\(i)] = \(String(reflecting: p))")
                  }
              }
              print("")
          }

          probe("A: newline in path", "/tmp/x\nopen -a Calculator\nz")
          probe("B: plain missing", "/tmp/nonexistent-abc-999")
          probe("C: newline middle", "/tmp/aa\nbb")
          print("=== done ===")
          SWIFTEOF
          echo "written:"
          wc -l work/t.swift

      - name: Run
        run: |
          cd work
          swift t.swift 2>&1 | tee out.txt
          echo ""
          echo "=== exit: $? ==="

      - name: Summary
        if: always()
        run: |
          echo "################################################"
          echo "SUMMARY"
          echo "################################################"
          for k in has_LF_0a LF_count has_CR_0d has_ASCII_22 has_U201C has_U201D has_U2019 line_count; do
            V=$(grep -m1 "^$k" work/out.txt 2>/dev/null || echo "$k = (missing)")
            echo "  $V"
          done
          echo ""
          echo "=== lines ==="
          grep -m12 "line\[" work/out.txt 2>/dev/null || true
